<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=add,settings,stars,view_cozy" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <link rel="stylesheet" href="home-css.css">

    <title>TriviaBlast</title>
</head>

<body>
    <header>
        <div class="quiz-tittle">
            <span class="material-icons">quiz</span>
            <h1>TriviaBlast</h1>
        </div>
        <div>
            <div>
                <p>Puntaje</p>
            </div>
            <span class="material-symbols-outlined">settings</span>
        </div>
    </header>

    <div class="welcomeSection">
        <div class="welcome">
            <p id="saludo"></p>
            <span id="steak"></span>
            <span class="textBadge">Complete one more Trivia today to unlock the Bronze Badge.</span>
            <button id="randomPlayButton"><span class="material-icons">rocket_launch</span>Random Play</button>

        </div>
        <div class="totalPointsContainer">
            <span class="material-symbols-outlined">stars</span>
            <div>
                <p id="points"></p>
                <p class="totalPoints"> TOTAL POINTS</p>
            </div>
        </div>
    </div>

    <section>
        <div class="tittleYourGames">
            <h3>Your Games</h3>
            <div>
                <button class="filterList"><span class="material-icons">filter_list</span></button>
                <button class="viewCozy"><span class="material-symbols-outlined">view_cozy</span></button>
            </div>
        </div>
        <div id="yourGames">

        </div>
    </section>

    <button id="createButton">
        <span class="material-symbols-outlined" >add</span>
    </button>

    <script src="home-javaS.js"></script>
</body>

</html>
