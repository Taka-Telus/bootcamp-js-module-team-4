<html lang="en">
    <!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=add,delete_forever,settings,stars,view_cozy,warning" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <link rel="stylesheet" href="create-style.css">

    <title>TriviaBlast</title>
</head>

<body>
    <header>
        <div class="quiz-tittle">
            <span class="material-icons">quiz</span>
            <h1>TriviaBlast</h1>
        </div>
        <div class="puntajeContainer">
            <div id="puntajeC">
                <p id="puntaje">
                <p>Puntaje</p>
            </div>
            <span class="material-symbols-outlined">settings</span>
        </div>
    </header>
    
    <section>
        <div>
            <div class="information">
                <h2>Informacion Basica del juego</h2>
                <div>
                    <p>Titulo del juego</p>
                    <input id="title-game" />
                </div>
                <div>
                    <p>Descripcion Corta</p>
                    <input id="description" />
                </div>
                <div>
                    <p>Dificultad</p>
                    <input id="dificultad" />
                </div>
            </div>
            <div class="imagenSelector">
                <p>Imagen Portada</p>
                <label for="imagen"></label>
                <input type="file" id="imagen" name="imagen" accept="image/*" required >
            </div>
        <div>
            <div>
                <span class="material-symbols-outlined">quiz</span><p>Cuestionario</p>
                <button><span class="material-symbols-outlined">add</span> Agregar Pregunta</button>
            </div>
        </div>
        <div id="questions">
            
        </div>

        <div>
            <button><span class="material-symbols-outlined">delete_forever</span>Eliminar Juego Completo</button>
            <button>cancel</button>
            <button>Guardar Cambios</button>
        </div>
        

    </section>
</body>
</html>
