<html lang="en">
<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=add,delete,delete_forever,settings,stars,image,view_cozy,warning" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <link rel="stylesheet" href="create-style.css">

    <title>TriviaBlast</title>
</head>

<body>
    <header>
        <div class="quiz-tittle">
            <span class="material-icons">quiz</span>
            <h1>TriviaBlast</h1>
        </div>
        <div class="puntajeContainer">
            <div id="puntajeC">
                <p id="puntaje">
                <p>Puntaje</p>
            </div>
            <span class="material-symbols-outlined">settings</span>
        </div>
    </header>

    <main>
        <div class="basicInformationContainer">
            <section class="information">
                <h2>Informacion Basica</h2>
                <div>
                    <h3>Titulo del juego</h3>
                    <input id="title-game" />
                </div>
                <div>
                    <h3>Descripcion Corta</h3>
                    <input id="description" />
                </div>
                <div>
                    <h3>Dificultad</h3>
                    <input id="difficulty" />
                </div>
            </section>
            <section class="imageSelector">
                <div>
                    <label for="imagen" class="imageUpload">
                        <span class="material-symbols-outlined">image</span>
                        <h3>Imagen Portada<h3>
                                <input id="imagenURL">
                    </label>
                </div>


                <div class="timeContainer">
                    <div id="amountQuestions"></div>
                    <!-- <p>${questions}</p><span>PREGUNTAS</span> -->
                    <div class="time">
                        <p>30
                        <p><span>ESTIMADO</span>
                    </div>

                </div>
            </section>
        </div>



        <div class="addQuestionContainer">
            <div style="display: flex; align-items: center; flex-direction: row;">
                <span class="material-symbols-outlined">quiz</span>
                <p>Cuestionario</p>
            </div>
            <button id="addQuestion"><span class="material-symbols-outlined">add</span> Agregar Pregunta</button>
        </div>

        <div id="questions">
            <div class="question">

                <div class="insertQuestion">
                    <p id="" class="numberQuestion">1</p>
                    <input type="text" id="inputQuestion" class="inputQuestion"/>
                    <button class="delete-question"><span class="material-symbols-outlined">delete</span></button>
                </div>
                
                <div class="selectAnswer">
                    <div class="answerContainer">
                        <p>A.</p>
                        <input type="text" class="inputAnswer" />
                        <button id="answerA"></button>
                    </div>
                    
                    <div class="answerContainer">
                        <p>B.</p>
                        <input type="text" class="inputAnswer" />
                        <button id="answerB"></button>
                    </div>
                    
                    <div class="answerContainer">
                        <p>C.</p>
                        <input type="text" class="inputAnswer" />
                        <button id="answerC"></button>
                    </div>
                    <div class="answerContainer">
                        <p>D.</p>
                        <input type="text" class="inputAnswer" />
                        <button id="answerD"></button>
                    </div>
                    
                </div>
            </div>

            <!-- Aca van las nuevas -->
        </div>

        <div>
            <button><span class="material-symbols-outlined">delete_forever</span>Eliminar Juego
                Completo</button>
            <button>cancel</button>
            <button>Guardar Cambios</button>
        </div>
        </div>
<script src="createEdit.js"></script>
</body>

</html>
