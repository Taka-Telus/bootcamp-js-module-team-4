<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login-style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=database,edit,stadia_controller" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">



    <title>Login</title>
</head>

<body>

    <h1 style="display: none;"></h1>

    <div class="nickname-container">
        <div class="controller">
            <span class="material-symbols-outlined">stadia_controller</span>
        </div>
        <h2>¡Hola! ¿Cómo te llamas?</h2>
        <p class="text-login">Bienvenido a TriviaBlast. Introduce tu apodo para
            comenzar a competir en los rankings globales.</p>
        <form class="nickname-inputs">
            <div class="nickname-input-order">
                <input placeholder="Escribe tu nombre..." id="nickname-player" />
                <a><span class="material-symbols-outlined">edit</span></a>
            </div>
            <button id="nickname-button">EMPEZAR <span class="material-icons">play_arrow</span></button>
        </form>
        <p id="nickname-error"></p>
        <div class="database-container">
            <span class="material-symbols-outlined">database</span>
            <p class="database-text">Tu nombre se guardará localmente en este dispositivo</p>
        </div>
    </div>
    <script src="login-java.js"></script>
</body>

</html>
