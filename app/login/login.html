<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login-style.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />


    <title>Login</title>
</head>

<body>

    <h1 style="display: none;"></h1>

    <div class="nickname-container">
        <span class="material-symbols-outlined">stadia_controller</span>
        <h2>¡Hola! ¿Cómo te llamas?</h2>
        <p class="text-login">Bienvenido a TriviaBlast. Introduce tu apodo para
            comenzar a competir en los rankings globales.</p>
        <form class="nickname-inputs">
            <div class="nickname-input-order">
                <input placeholder="Escribe tu nombre..." id="nickname-player" />
                <a><span class="material-symbols-outlined">edit</span></a>
            </div>
            <button id="nickname-button">EMPEZAR <span class="material-symbols-outlined">play_arrow</span></button>
        </form>
        <p id="nickname-error">
        <p>
        <p class="database-text"><span class="material-symbols-outlined">database</span>Tu nombre se guardará localmente
            en este
            dispositivo</p>
    </div>
    <script src="login-java.js"></script>
</body>

</html>
