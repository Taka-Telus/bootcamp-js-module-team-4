        function shuffle(array) {
            array.sort(() => Math.random() - 0.5)
        }


        let total_score = 0;

        async function jugar() {
            for (let question of gameObject.questions) {
                shuffle(question.options);

                document.querySelector("#card-1").textContent = question.options[0];

                let tiempo = await iniciarTimer();

                total_score = calcularPuntaje(tiempo, total_score);
            }

            console.log("Puntaje final:", total_score);
        }


        function iniciarTimer() {
            return new Promise((resolve) => {
                let tiempoRestante = 30;
                let inicio = performance.now();
                let terminado = false;

                const timeout = setTimeout(() => {
                    if (!terminado) {
                        terminado = true;
                        resolve(0);
                    }
                }, 30000);

                document.querySelectorAll(".card").forEach(card => {
                    card.onclick = () => {
                        if (terminado) return;

                        terminado = true;
                        clearTimeout(timeout);

                        const transcurrido = (performance.now() - inicio) / 1000;
                        tiempoRestante = Math.max(0, 30 - transcurrido);

                        resolve(tiempoRestante);
                    };
                });
            });
        }


        function calcularPuntaje(time, current_score) {
            let question_score = time * 10;
            return current_score + question_score;
        }

    </script>
