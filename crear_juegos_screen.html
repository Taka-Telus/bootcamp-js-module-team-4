<html>

<body>
  <ul id="game-list"></ul>

  <script>
    async function loadGames() {
      try {
        const response = await fetch("./games/game_ids.json");

        if (!response.ok) {
          throw new Error("No se pudo cargar game_ids.json");
        }

        const games = await response.json();
        const gameList = document.getElementById("game-list");

        gameList.innerHTML = "";

        games.forEach((game) => {
          const li = document.createElement("li");
          li.classList.add("juego");
          li.dataset.id = game.id;

          li.innerHTML = `
        <img src="${game.image}" alt="${game.title}" width="100">
        <h3>${game.title}</h3>
        <p>Autor: ${game.author}</p>
        <p>Dificultad: ${game.difficulty}</p>
        <p>Preguntas: ${game.questionCount}</p>

        <button class="edit">Editar</button>
        <button class="play">Jugar</button>
      `;

          gameList.appendChild(li);
        });
      } catch (error) {
        console.error(error);
      }
    }

    async function loadGame(id) {
      const response = await fetch(`./games/${id}.json`);

      if (!response.ok) {
        throw new Error(`No se pudo cargar el juego ${id}`);
      }

      return await response.json();
    }

    document.getElementById("game-list").addEventListener("click", async (event) => {
      const item = event.target.closest(".juego");

      if (!item) return;

      const id = item.dataset.id;

      if (event.target.classList.contains("play")) {
        const game = await loadGame(id);
        console.log("Jugar:", game);
        // startGame(game);
      }

      if (event.target.classList.contains("edit")) {
        const game = await loadGame(id);
        console.log("Editar:", game);
        // editGame(game);
      }
    });

    loadGames();
  </script>
</body>

</html>
