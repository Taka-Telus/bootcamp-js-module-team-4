<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login-style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <title>Login</title>
</head>

<body>
    <script src="https://kit.fontawesome.com/a439f46108.js" crossorigin="anonymous"></script>
    <h1 style="display: none;"></h1>

    <div class="nickname-container">
        <i class="fa-solid fa-gamepad"></i>
        <h2>¡Hola! ¿Cómo te llamas?</h2>
        <p class="text-login">Bienvenido a TriviaBlast. Introduce tu apodo para
            comenzar a competir en los rankings globales.</p>
        <form class="nickname-inputs">
            <div class="nickname-input-order">
                <input type="Escribe tu nombre..." id="nickname-player" />
                <a><i class="fa-solid fa-pencil"></i></a>
            </div>
            <button id="nickname-button">Empezar <i class="fa-solid fa-play"></i></button>
        </form>
        <p id="nickname-error"><p>
            <p class="database-text"><i class="fa-solid fa-database"></i>Tu nombre se guardará localmente en este dispositivo</p>
        </div>
    <script src="login-java.js"></script>
</body>

</html>
